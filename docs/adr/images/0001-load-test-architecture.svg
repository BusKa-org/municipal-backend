  <path d="M646,440 L532,400" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- box titles -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">
    <text x="158" y="126">tiers/&lt;tier&gt;.json</text>
    <text x="158" y="240">run_tier.sh</text>
    <text x="410" y="138">generate_data.py</text>
    <text x="410" y="260">k6 &#8212; main.js</text>
    <text x="410" y="392">observe.sh</text>
    <text x="284" y="500">results/&lt;tier&gt;-&lt;timestamp&gt;/</text>
