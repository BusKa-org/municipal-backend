    <path d="M284,240 V142 H296"/>
    <path d="M284,240 V264 H298"/>
    <path d="M284,240 V396 H298"/>
    <path d="M410,178 V224"/>
    <path d="M520,142 H864"/>
    <path d="M520,264 H608"/>
    <path d="M722,226 V196 H973 V188"/>
    <path d="M832,278 H850 V372 H864"/>
