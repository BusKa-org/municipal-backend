    <rect x="48"  y="470" width="472" height="68" rx="8" stroke="#8c959f"/>
    <rect x="612" y="228" width="220" height="72" rx="8" stroke="#0969da"/>
    <rect x="868" y="100" width="210" height="84" rx="8" stroke="#1a7f37"/>
    <rect x="868" y="330" width="210" height="84" rx="8" stroke="#9a6700"/>
