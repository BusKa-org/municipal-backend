name: Deploy Backend Release

on:
  push:
    branches: [release/v1.1.0]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: buska_user
          POSTGRES_PASSWORD: buska_pass
          POSTGRES_DB: buska_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U buska_user; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests
        env:
          DB_USER: buska_user
          DB_PASSWORD: buska_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: buska_db
          JWT_SECRET_KEY: test_secret
        run: pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: [self-hosted]
    if: github.ref == 'refs/heads/release/v1.1.0' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Create .env.prod
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          printf 'DB_USER=%s\nDB_PASSWORD=%s\nDB_NAME=%s\nAPI_PORT=5000\nJWT_SECRET_KEY=%s\nJWT_EXPIRES_HOURS=2\n' \
            "$DB_USER" "$DB_PASSWORD" "$DB_NAME" "$JWT_SECRET" > .env.prod
          chmod 600 .env.prod

      - name: Build image
        run: |
          docker build -t buska-backend:${{ github.sha }} .
          docker tag buska-backend:${{ github.sha }} buska-backend:latest

      - name: Deploy containers
        run: |
          # Não usar --volumes: preserva o banco se já estiver funcional
          docker-compose -f docker-compose.prod.yml down || true
          docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d

      - name: Wait for database
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          for i in {1..60}; do
            if docker exec buska_db_prod pg_isready -U "$DB_USER" -d "$DB_NAME" 2>/dev/null; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/60)"
            sleep 2
          done

      - name: Ensure DB extensions and schema (idempotent)
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_HOST: localhost
          DB_PORT: "5432"
        run: |
          docker exec buska_db_prod psql -U "$DB_USER" -d "$DB_NAME" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";' || true

      - name: Set up Python for migrations
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies for Alembic and seed
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations (no-op if already up to date)
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python -m alembic upgrade head

      - name: Seed database (skips if data already exists)
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_HOST: localhost
          DB_PORT: "5432"
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET }}
        run: python seed.py

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          echo "Health check failed"
          echo "==== docker ps ===="
          docker ps
          echo "==== docker logs buska_api ===="
          docker logs buska_api || true
          exit 1