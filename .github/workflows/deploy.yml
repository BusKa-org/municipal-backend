name: Deploy Backend Release

on:
  push:
    branches: [release/v1.1.0]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: [self-hosted]
    if: github.ref == 'refs/heads/release/v1.1.0' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Create .env.prod
        run: |
          cat > .env.prod << EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          API_PORT=5000
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_HOURS=2
          EOF

      - name: Build image
        run: |
          docker build -t buska-backend:${{ github.sha }} .
          docker tag buska-backend:${{ github.sha }} buska-backend:latest

      - name: Deploy containers
        run: |
          docker compose -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5000/docs/ > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          echo "Health check failed"
          exit 1