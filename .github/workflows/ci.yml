name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Check formatting with black
        run: uv run black --check app/ tests/

      - name: Lint with ruff
        run: uv run ruff check app/ tests/

      - name: Type check with mypy
        run: uv run mypy app/ --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: buska_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: buska_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://buska_test:test_password@localhost:5432/buska_test_db
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: buska_test
          DB_PASSWORD: test_password
          DB_NAME: buska_test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          FLASK_ENV: testing
          DEBUG: false
        run: |
          uv run pytest tests/ -v --tb=short

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Check for security vulnerabilities
        run: |
          uv pip install safety
          safety check --json || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: buska-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
