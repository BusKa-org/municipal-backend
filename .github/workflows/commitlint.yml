name: Commit Message Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Validate commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint all commits in this PR
        # wagoid/commitlint-github-action v6.2.1, pinned by commit SHA (not
        # the mutable `v6` tag) so a compromised/repointed tag upstream can't
        # silently change what runs in our CI.
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.yml
