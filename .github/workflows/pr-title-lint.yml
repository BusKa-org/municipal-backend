name: PR Title Lint

# Uses `pull_request`, not `pull_request_target`. The latter is the action's
# own recommended default (needed for fork-based PRs), but it always runs the
# workflow definition from the base branch — so a workflow added in a PR
# would never fire for that same PR (or for any PR still in flight when the
# workflow file changes). This repo doesn't take contributions from forks
# (all contributors have write access), so `pull_request` — which runs the
# version of this file from the PR branch itself — is the correct choice.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title matches Conventional Commits
        # amannn/action-semantic-pull-request v6.1.1, pinned by commit SHA
        # (not the mutable v6 tag) for the same supply-chain reason as
        # commitlint.yml. This repo squash-merges, so the PR title becomes
        # the permanent commit message on main — commitlint.yml alone only
        # checks the throwaway in-branch commits that get discarded at
        # merge time.
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
