services:
  db:
    image: postgis/postgis:16-3.4
    container_name: buska_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-buska_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-buska_pass}
      POSTGRES_DB: ${DB_NAME:-buska_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - buska_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-buska_user} -d ${DB_NAME:-buska_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buska_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-buska_user}
      DB_PASSWORD: ${DB_PASSWORD:-buska_pass}
      DB_NAME: ${DB_NAME:-buska_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-2}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buska_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/apidocs/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  buska_network:
    driver: bridge
